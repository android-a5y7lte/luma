# SPDX-License-Identifier: Apache-2.0
#
# POCO X3 NFC (surya) bring-up build, for the maintainer's fork.
# Stage 1: kernel + DTBs + a debug initramfs packed as boot images for
# `fastboot boot` (RAM only; nothing is flashed). See devices/xiaomi/surya/INSTALL.md.
name: surya build

on:
  push:
    branches: [surya]
    paths:
      - devices/xiaomi/surya/**
      - socs/qcom/sm7150/**
      - scripts/mobile/surya/**
      - .github/workflows/surya-build.yml
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel repository
        default: https://github.com/sm7150-mainline/linux
      kernel_ref:
        description: Kernel branch or tag
        default: v7.1_rc3
      rootfs:
        description: Build the Luma phone userdata image (stage 2)
        type: boolean
        default: false
      luma_ref:
        description: Luma ARM OSTree ref (empty = first of stable, beta, nightly)
        default: ""

permissions:
  contents: read

concurrency:
  group: surya-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Luma device tree checks
        run: |
          python -m venv /tmp/devices
          /tmp/devices/bin/pip install --quiet jsonschema==4.23.0
          /tmp/devices/bin/python -B tools/check-devices.py
          /tmp/devices/bin/python -B -m unittest devices/xiaomi/surya/tests/test_xiaomi_surya.py

  uboot:
    # U-Boot as a second-stage bootloader, as postmarketOS boots SM7150 phones
    # since 2025-03: ABL loads u-boot.img (header v0, U-Boot + appended DTB),
    # U-Boot then boots Linux (EFI, or `fastboot boot` from its own menu).
    # Source: sm7150-mainline/u-boot, the tree postmarketOS' releases come from.
    needs: device-checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      UBOOT_REPO: https://github.com/sm7150-mainline/u-boot
      UBOOT_COMMIT: f8c04469e8284aa2f1691a30aa3b7dc59fa0b8cd
    steps:
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libgnutls28-dev \
            python3 python3-setuptools swig
          # Ubuntu's mkbootimg is broken; use the C one, as sm7150-mainline/u-boot CI does.
          git clone --depth 1 https://github.com/osm0sis/mkbootimg "$RUNNER_TEMP/mkbootimg"
          make -C "$RUNNER_TEMP/mkbootimg" CFLAGS=-Wstringop-overflow=0 mkbootimg
      - name: U-Boot
        run: |
          git init -q u-boot && cd u-boot
          git fetch -q --depth 1 "$UBOOT_REPO" "$UBOOT_COMMIT" && git checkout -q FETCH_HEAD
          make O=.output qcom_defconfig qcom-phone.config tauchgang.config
          mkdir -p ../dist
          for panel in huaxing tianma; do
            dev=sm7150-xiaomi-surya-$panel
            make O=.output -j"$(nproc)" CONFIG_DEFAULT_DEVICE_TREE=qcom/$dev
            gzip -9n -c .output/u-boot-nodtb.bin > .output/u-boot-nodtb.bin.gz
            cat .output/u-boot-nodtb.bin.gz .output/dts/upstream/src/arm64/qcom/$dev.dtb > .output/uboot-dtb
            "$RUNNER_TEMP/mkbootimg/mkbootimg" --base 0x0 --kernel_offset 0x00008000 --pagesize 4096 \
              --os_version 17.0.0 --os_patch_level 2035-06 \
              --kernel .output/uboot-dtb -o "../dist/u-boot-surya-$panel.img"
          done
          echo "u-boot: $UBOOT_REPO @ $UBOOT_COMMIT" > ../dist/BUILD-INFO-uboot.txt
          cd ../dist && sha256sum *.img | tee SHA256SUMS-uboot
      - uses: actions/upload-artifact@v4
        with:
          name: u-boot-surya-${{ github.run_number }}
          path: dist/
          retention-days: 30

  stage1:
    needs: device-checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo || 'https://github.com/sm7150-mainline/linux' }}
      KERNEL_REF: ${{ inputs.kernel_ref || 'v7.1_rc3' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            cpio busybox-static mkbootimg file zstd kmod python3
          # Ubuntu's mkbootimg imports gki.generate_gki_certificate but does not
          # ship it. It is only used for GKI boot signatures (header v4), never
          # for surya's header v2, so a stub module is enough.
          mkdir -p "$RUNNER_TEMP/pystub/gki"
          touch "$RUNNER_TEMP/pystub/gki/__init__.py"
          printf 'def generate_gki_certificate(*args, **kwargs):\n    raise SystemExit("GKI signing is not used for surya")\n' \
            > "$RUNNER_TEMP/pystub/gki/generate_gki_certificate.py"
          echo "PYTHONPATH=$RUNNER_TEMP/pystub" >> "$GITHUB_ENV"
          PYTHONPATH="$RUNNER_TEMP/pystub" mkbootimg --help | grep -q -- --dtb
      - name: Kernel
        run: scripts/mobile/surya/build-kernel.sh out/kernel
      - name: Debug initramfs
        run: scripts/mobile/surya/build-debug-initramfs.sh out/kernel out/initramfs-debug.cpio.gz
      - name: Boot images (RAM boot only)
        run: |
          mkdir -p dist
          for panel in huaxing tianma; do
            # Through U-Boot (dtbo erased), header v2 is what boots.
            scripts/mobile/surya/build-boot-image.sh out/kernel \
              out/initramfs-debug.cpio.gz "dist/luma-surya-stage1-$panel-v2.img" "$panel" debug
            scripts/mobile/surya/build-boot-image.sh out/kernel \
              out/initramfs-debug.cpio.gz "dist/luma-surya-stage2-usb-root-$panel.img" "$panel" nbd
            scripts/mobile/surya/build-boot-image.sh out/kernel \
              out/initramfs-debug.cpio.gz "dist/luma-surya-stage2-usb-root-safe-$panel.img" "$panel" nbd-safe
          done
          release=$(cat out/kernel/kernelrelease)
          cp out/kernel/config-* dist/
          cp scripts/mobile/surya/serve-usb-root.sh dist/
          tar -C out/kernel/modules -I 'zstd -19 -T0' -cf "dist/modules-$release.tar.zst" .
          {
            echo "kernel release: $release"
            echo "kernel source: $KERNEL_REPO @ $KERNEL_REF ($(cat out/kernel/source-commit))"
            echo "luma commit: $GITHUB_SHA"
          } > dist/BUILD-INFO.txt
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/BUILD-INFO.txt dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: luma-surya-stage1-${{ github.run_number }}
          path: dist/
          retention-days: 30

  rootfs:
    # Luma's generic phone userdata image (scripts/mobile/build-phone-userdata.sh)
    # from the public signed OSTree repository: the same image every phone
    # installs. Stage 2 serves it to surya over USB (serve-usb-root.sh).
    if: (github.event_name == 'workflow_dispatch' && inputs.rootfs) || contains(github.event.head_commit.message, '[rootfs]')
    needs: device-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h / /mnt
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ostree policycoreutils dosfstools e2fsprogs fdisk zstd python3 gnupg
      - name: Pull the Luma ARM commit
        env:
          LUMA_REF: ${{ inputs.luma_ref }}
        run: |
          sudo mkdir -p /mnt/luma && sudo chown "$USER" /mnt/luma
          repo=/mnt/luma/repo
          ostree --repo=$repo init --mode=archive
          ostree --repo=$repo remote add --gpg-import=config/os/keys/luma-os-release.asc \
            --set=gpg-verify=true --set=gpg-verify-summary=true luma https://dl.simplyluma.com/os/repo
          ostree --repo=$repo remote refs luma | tee /mnt/luma/refs.txt
          ref=$LUMA_REF
          if [ -z "$ref" ]; then
            for channel in stable beta nightly; do
              if grep -qx "luma:luma/1/aarch64/$channel" /mnt/luma/refs.txt; then ref=luma/1/aarch64/$channel; break; fi
            done
          fi
          [ -n "$ref" ] || { echo "no public luma/1/aarch64 ref"; exit 1; }
          echo "LUMA_REF=$ref" >> "$GITHUB_ENV"
          ostree --repo=$repo pull --depth=0 luma "$ref"
          ostree --repo=$repo refs --create="$ref" "luma:$ref"
          ostree --repo=$repo show "$ref" | head -20
          du -sh $repo
      - name: Generic phone userdata image
        run: |
          mkdir -p dist
          sudo TMPDIR=/mnt/luma scripts/mobile/build-phone-userdata.sh \
            --repo /mnt/luma/repo --ref "$LUMA_REF" --output /mnt/luma/luma-phone-userdata.simg --size 24G
          sudo chown "$USER" /mnt/luma/luma-phone-userdata.simg*
          zstd -T0 -10 --rm /mnt/luma/luma-phone-userdata.simg -o dist/luma-phone-userdata.simg.zst
          cp /mnt/luma/luma-phone-userdata.simg.manifest dist/
          (cd dist && sha256sum * | tee SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: luma-phone-userdata-${{ github.run_number }}
          path: dist/
          compression-level: 0
          retention-days: 30
